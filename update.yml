# Opcional (GitHub Pages): actualiza auto.json cada hora.
# Guarda IG_USER_ID e IG_TOKEN en Settings > Secrets and variables > Actions.
name: Actualizar feed
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_feed.py
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add auto.json assets/auto && (git commit -m "Actualizar feed" && git push) || true
