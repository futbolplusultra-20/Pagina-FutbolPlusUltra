<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la Noticia</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #333; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .imagen-destacada { width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="card">
        <a href="index.html">← Volver al inicio</a>
        <h1 id="titulo">Cargando noticia...</h1>
        <p id="fecha" style="color: #666;"></p>
        <img id="imagen" src="assets/forbs.jpg" alt="Imagen noticia" class="imagen-destacada">
        <div id="contenido" style="margin-top: 20px;"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                const noticia = data.find(item => item.id == id) || data[0];
                if (noticia) {
                    document.getElementById('titulo').innerText = noticia.titulo;
                    document.getElementById('fecha').innerText = noticia.fecha;
                    document.getElementById('contenido').innerText = noticia.contenido || noticia.resumen;
                }
            })
            .catch(err => console.error("Error al cargar la noticia:", err));
    </script>
</body>
</html>
